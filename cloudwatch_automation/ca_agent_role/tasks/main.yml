---
# tasks/main.yaml

- name: Install CloudWatch Agent on Debian-based systems
  ansible.builtin.include_tasks: debian.yaml
  when:
    - ansible_os_family == "Debian"

- name: Install CloudWatch Agent on RHEL-based systems
  ansible.builtin.include_tasks: rhel.yml
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution != "Amazon"

- name: Install CloudWatch Agent on Amazon Linux
  ansible.builtin.include_tasks: amazon.yaml
  when:
    - ansible_distribution == "Amazon"

- name: Deploy CloudWatch Agent configuration
  ansible.builtin.template:
    src: amazon-cloudwatch-agent.json.j2
    dest: "{{ cloudwatch_agent.config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart CloudWatch Agent

- name: Enable and start CloudWatch Agent
  ansible.builtin.systemd_service:
    name: "{{ cloudwatch_agent.service_name }}"
    enabled: true
    state: started

- name: Check CloudWatch Agent status
  ansible.builtin.command:
    cmd: "{{ cloudwatch_agent.control_path }} -m ec2 -a status"
  register: cwagent_status
  changed_when: false

- name: Display CloudWatch Agent status
  ansible.builtin.debug:
    var: cwagent_status.stdout
